{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm border-0">
            <form action="/start" method="post" id="dl-form">

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label fw-bold m-0">
                            <i class="fa-solid fa-link text-primary me-1"></i> Media Link
                        </label>
                        <button type="button" class="btn btn-sm btn-outline-primary border-0" onclick="pasteUrl()">
                            <i class="fa-solid fa-paste me-1"></i> Paste
                        </button>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i id="url-icon" class="fa-solid fa-globe text-muted"></i>
                        </span>
                        <input type="url" name="url" id="url-input" class="form-control"
                               placeholder="YouTube, Instagram, TikTok..."
                               value="{{ auto_url | e }}"
                               required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        <i class="fa-solid fa-sliders text-primary me-1"></i> Quality
                    </label>
                    <select name="format" id="format-select" class="form-select">
                        <option value="bv*+ba/b">✨ Best Available</option>
                        <option value="bv*[height<=1080]+ba/b">🎬 Full HD (1080p)</option>
                        <option value="bv*[height<=720]+ba/b">📽️ HD (720p)</option>
                        <option value="bv*[height<=480]+ba/b">📹 SD (480p)</option>
                        <option value="bestaudio[ext=m4a]/bestaudio">🎼 M4A Audio</option>
                        <option value="mp3">🎵 MP3 Audio</option>
                    </select>
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="playlist" id="pl">
                    <label class="form-check-label fw-medium" for="pl">
                        <i class="fa-solid fa-list-check me-1"></i> Download Playlist
                    </label>
                </div>
                <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" name="subs" id="subs"
                           onchange="document.getElementById('sub-langs-row').classList.toggle('d-none', !this.checked)">
                    <label class="form-check-label fw-medium" for="subs">
                        <i class="fa-solid fa-closed-captioning me-1"></i> Subtitles
                    </label>
                </div>
                <div id="sub-langs-row" class="mb-2 ps-4 d-none">
                    <input type="text" name="sub_langs" class="form-control form-control-sm"
                           value="en,ar" placeholder="e.g. en,ar,fr">
                </div>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="sponsorblock" id="sb">
                    <label class="form-check-label fw-medium" for="sb">
                        <i class="fa-solid fa-shield-halved me-1"></i> Skip Sponsors
                    </label>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" name="archive" id="archive">
                    <label class="form-check-label fw-medium" for="archive">
                        <i class="fa-solid fa-box-archive me-1"></i> Skip Already Downloaded
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                    <span id="btn-text">
                        <i class="fa-solid fa-cloud-arrow-down me-2"></i>START DOWNLOAD
                    </span>
                </button>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
